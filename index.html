<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Style Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Knewave&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23c53a26'/><text x='16' y='24' font-family='Georgia,serif' font-style='italic' font-size='24' text-anchor='middle' fill='%23f4efe4'>S</text></svg>">
<script src="data/styles.js"></script>
<script>window.DL_BASE = '';</script>
<script src="shared/lib.js"></script>
</head>
<body>

<div class="tape" aria-hidden="true"><div class="tape__run" id="tape"></div></div>

<header class="cover">
  <div class="cover__strip">
    <button class="cover__theme" id="theme" type="button">Lights</button>
    <div class="cover__shots" id="strip"></div>
    <p class="cover__script" aria-hidden="true">Style<br>Library</p>
  </div>
  <div class="cover__panel" id="intro">
    <h1>Every Way <em>a</em> Website Can L<em>oo</em>k, Filed <em>&amp;</em> Descri<em>bed</em></h1>
    <label class="search">
      <span class="search__label">Search the library</span>
      <input id="q" type="search" placeholder="a mood, a colour, a trick" autocomplete="off" spellcheck="false">
    </label>
    <p class="scribble" aria-hidden="true">
      <span>start<br>typing</span>
      <svg viewBox="0 0 60 50" fill="none"><path d="M4 6c22-4 42 8 44 34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M38 31l10 10 6-13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </p>
  </div>
</header>

<div class="bar" id="bar">
  <div class="status">
    <p class="status__text" id="count" aria-live="polite"></p>
    <button class="status__clear" id="clear" type="button" hidden>Clear</button>
  </div>
  <nav class="cats" aria-label="Categories"><div class="cats__in" id="cats"></div></nav>
</div>

<main class="wall">
  <p class="wall__word" id="word" aria-hidden="true">Library</p>
  <div class="mosaic" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <p id="emptyText">Nothing <em>filed</em> under that.</p>
    <div class="empty__acts">
      <button class="pill pill--btn" id="widen" type="button" hidden></button>
      <button class="pill pill--btn" id="reset" type="button">Clear the search</button>
    </div>
  </div>
</main>

<footer class="foot">
  <p class="foot__script" aria-hidden="true">fin.</p>
  <p>Drop new screenshots into <code>/resources</code> and refresh. They show up as drafts until classified. Last synced <span id="genAt">not yet</span>.</p>
</footer>

<dialog class="sheet" id="sheet" aria-labelledby="dTitle">
  <button class="sheet__x" id="sheetX" type="button">Close</button>
  <div class="sheet__body" id="sheetBody"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body>
</html>
